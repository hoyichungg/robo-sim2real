name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 安裝 stable + clippy + rustfmt
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      # 快取 target/.cargo，加速編譯
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run clippy (RPi crates only)
        run: cargo clippy -p robot-core -p drivers -p platform_rpi --all-targets -- -D warnings

      - name: Run tests (RPi crates only)
        run: cargo test -p robot-core -p drivers -p platform_rpi --verbose

      - name: Run tests (sim2d headless)
        run: cargo test -p sim2d --no-default-features --verbose

  cross-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 安裝 stable（不需要 clippy）
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # 可選：裝 target（cross 其實會用 docker toolchain，這步可留可拿掉）
      - name: Add aarch64 target (optional)
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Build for aarch64 (RPi-only crates)
        run: |
          cross build --target aarch64-unknown-linux-gnu \
            -p robot-core \
            -p drivers \
            -p platform_rpi
